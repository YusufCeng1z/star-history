<svg width="900" height="450" viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" class="star-graph" data-style="matrix" style="--foreground: var(--fg); --muted-foreground: var(--muted); --background: var(--bg); --font-main: 'Inter', system-ui, -apple-system, sans-serif; --font-mono: 'JetBrains Mono', monospace; --primary: #00ff41; --primary-glow: rgba(237, 237, 237, 0.3); --bg: #000000; --fg: #00ff41; --muted: #0e8a30; --grid: transparent; --glow-1: 0px; --glow-2: 0px;"><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.28"></rect></pattern><linearGradient id="gradientFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--primary)" stop-opacity="0.3"></stop><stop offset="100%" stop-color="var(--primary)" stop-opacity="0"></stop></linearGradient><style>
			/* We embed the font directly in SVG so it works in READMEs */
			@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
			
			.star-graph {
				background-color: var(--background);
				border-radius: 12px;
				font-family: var(--font-main);
			}

			.graph-grid {
				stroke: var(--grid);
				stroke-dasharray: 4 4;
			}

			.graph-axis {
				stroke: var(--grid);
			}

			.graph-text {
				fill: var(--muted-foreground);
				font-size: 11px;
				font-family: var(--font-mono);
			}

			.svg-title {
				fill: var(--foreground);
				opacity: 0.85;
				font-size: 22px;
				font-weight: 600;
				font-family: var(--font-main);
			}
			
			.svg-star-count {
				fill: var(--foreground);
				font-size: 26px;
				font-weight: 700;
				font-family: var(--font-mono);
			}

			.star-count-group {
				transform-box: fill-box;
				transform-origin: center right;
				opacity: 0;
				animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
			}

			.graph-line {
				fill: none;
				stroke: var(--primary);
				stroke-width: 2.5;
				stroke-linecap: round;
				stroke-linejoin: round;
				filter: drop-shadow(0 0 var(--glow-1) var(--primary-glow)) drop-shadow(0 0 var(--glow-2) var(--primary-glow));
				/* Pure CSS line drawing, one pass */
				animation: drawLine 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
			}

			.graph-fill {
				fill: url(#gradientFill);
				opacity: 0;
				animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
			}

			.graph-point {
				fill: var(--background);
				stroke: var(--primary);
				stroke-width: 2;
				opacity: 0;
				animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
			}

			@keyframes drawLine {
				to { stroke-dashoffset: 0; }
			}

			@keyframes fadeIn {
				to { opacity: 1; }
			}

			.star-graph[data-style="space"] .graph-line { animation-duration: 2.4s; animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1); }
			.twinkle { animation: twinkle 3s ease-in-out infinite; }
			@keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
			.floor-scroll { animation: floor 1.4s linear infinite; }
			@keyframes floor { to { transform: translateY(14px); } }
			.rocket { offset-rotate: auto; offset-distance: 0%; opacity: 0; animation: fly 2.4s cubic-bezier(0.45, 0, 0.2, 1) 0.1s forwards; }
			@keyframes fly { 0% { offset-distance: 0%; opacity: 1; } 96% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
			.flame { animation: flame 0.18s steps(2) infinite; transform-box: fill-box; transform-origin: right center; }
			@keyframes flame { 50% { transform: scaleX(0.6); } }
			.ripple { fill: none; stroke: var(--primary); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ripple 2.2s cubic-bezier(0.16, 1, 0.3, 1) 2.6s infinite; }
			@keyframes ripple { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(5); } }
			.ascii-text { font-family: var(--font-mono); font-size: 12px; white-space: pre; }
			.ascii-fg { fill: var(--foreground); }
			.ascii-muted { fill: var(--muted-foreground); }
			.ascii-accent { fill: var(--primary); }
			.reveal-rect { transform-box: fill-box; transform-origin: left; animation: reveal 1.1s steps(48) 0.1s both; }
			.cursor { animation: blink 1s steps(1) infinite; }
			@keyframes reveal { from { transform: scaleX(0); } to { transform: scaleX(1); } }
			@keyframes blink { 50% { opacity: 0; } }
			@media (prefers-reduced-motion: reduce) {
				.reveal-rect, .cursor, .twinkle, .floor-scroll, .flame, .ripple { animation: none; }
				.rocket { display: none; }
				.ripple { opacity: 0; }
				.graph-line { animation: none; stroke-dashoffset: 0 !important; }
				.graph-fill, .graph-point, .star-count-group { animation: none; opacity: 1; }
			}
		 *{}</style></defs><!--[0--><defs><clipPath id="reveal"><rect x="90" y="60" width="768" height="282" class="reveal-rect"></rect></clipPath></defs><text x="34" y="36" class="ascii-text ascii-muted" textLength="112" lengthAdjust="spacing">> wake up, neo..</text><text x="162" y="36" class="ascii-text ascii-fg" textLength="96" lengthAdjust="spacing">sveltejs/kit</text><!--[--><text x="34" y="78" xml:space="preserve" class="ascii-text ascii-muted" textLength="56" lengthAdjust="spacing">  21K │</text><text x="90" y="78" xml:space="preserve" class="ascii-text ascii-accent" clip-path="url(#reveal)" textLength="768" lengthAdjust="spacing">                                                                                  ▁▁▂▃▃▄▄▅▆▆▇▇██</text><text x="34" y="93" xml:space="preserve" class="ascii-text ascii-muted" textLength="56" lengthAdjust="spacing">      │</text><text x="90" y="93" xml:space="preserve" class="ascii-text ascii-accent" clip-path="url(#reveal)" textLength="768" lengthAdjust="spacing">                                                                       ▁▂▂▃▄▄▅▆▆▇█··············</text><text x="34" y="108" xml:space="preserve" class="ascii-text ascii-muted" textLength="56" lengthAdjust="spacing">      │</text><text x="90" y="108" xml:space="preserve" class="ascii-text ascii-accent" clip-path="url(#reveal)" textLength="768" lengthAdjust="spacing">                                                            ▁▂▃▄▅▅▆▆▇██·························</text><text x="34" y="123" xml:space="preserve" class="ascii-text ascii-muted" textLength="56" lengthAdjust="spacing">      │</text><text x="90" y="123" xml:space="preserve" class="ascii-text ascii-accent" clip-path="url(#reveal)" textLength="768" lengthAdjust="spacing">                                                    ▁▂▃▄▅▆▇█····································</text><text x="34" y="138" xml:space="preserve" class="ascii-text ascii-muted" textLength="56" lengthAdjust="spacing">      │</text><text x="90" y="138" xml:spac